[package]
name = "treasury"
version = "0.1.0"
edition = "2021"
publish = false
# `tests/liquidity.test.rs` and `src/liquidity.rs` are an unfinished sketch for
# the auto-liquidity feature — they reference a `crate::types` module that does
# not exist yet. `liquidity` is therefore not declared in `lib.rs`, and
# integration-test auto-discovery is off so the sketch does not break
# `cargo test --workspace`. Re-enable both when that feature lands.
autotests = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.4"
governance = { path = "../governance" }

[dev-dependencies]
soroban-sdk = { version = "21.4", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
