[package]
name = "treasury"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.4"
governance = { path = "../governance" }

[dev-dependencies]
soroban-sdk = { version = "21.4", features = ["testutils"] }
call_registry = { path = "../call_registry" }

[features]
testutils = ["soroban-sdk/testutils"]
